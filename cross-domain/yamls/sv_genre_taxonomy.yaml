name: SV_GENRE_TAXONOMY
description: 'Business Ontology domain: Genre Taxonomy. Genre classification and roll-up; imports SV_GAME_CATALOG for GAMES.'
imports:
- database_name: ONTOLOGY_DEMO
  schema_name: CROSS_DOMAIN
  name: SV_GAME_CATALOG
tables:
- name: GENRE_CLASSIFICATION
  base_table:
    database: ONTOLOGY_DEMO
    schema: GAME_CATALOG
    table: GAME_GENRE_CLASSIFICATION
  primary_key:
    columns:
    - GAME_ID
    - GENRE
  dimensions:
  - name: GENRE
    expr: GENRE
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  - name: MATCH_STATUS
    expr: MATCH_STATUS
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  metrics:
  - name: CLASSIFIED_GAME_COUNT
    expr: COUNT(DISTINCT genre_classification.GAME_ID)
    access_modifier: public_access
- name: GENRE_ROLLUP
  base_table:
    database: ONTOLOGY_DEMO
    schema: GAME_CATALOG
    table: VW_GAME_GENRE_ROLLUP
  primary_key:
    columns:
    - GAME_ID
    - ROLLUP_GENRE
  dimensions:
  - name: ROLLUP_GENRE
    expr: ROLLUP_GENRE
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  - name: ROLLUP_DEPTH
    expr: ROLLUP_DEPTH
    data_type: NUMBER(38,0)
    access_modifier: public_access
  metrics:
  - name: ROLLUP_GAME_COUNT
    expr: COUNT(DISTINCT genre_rollup.GAME_ID)
    access_modifier: public_access
relationships:
- name: GENRE_GAME
  left_table: GENRE_CLASSIFICATION
  right_table: GAMES
  relationship_columns:
  - left_column: GAME_ID
    right_column: GAME_ID
- name: GENRE_ROLLUP_GAME
  left_table: GENRE_ROLLUP
  right_table: GAMES
  relationship_columns:
  - left_column: GAME_ID
    right_column: GAME_ID
