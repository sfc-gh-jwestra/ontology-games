name: SV_GAME_CATALOG
description: 'Business Ontology domain: Game Catalog. Catalog games and franchises (GAME_CATALOG).'
tables:
- name: GAMES
  base_table:
    database: ONTOLOGY_DEMO
    schema: GAME_CATALOG
    table: GAMES
  primary_key:
    columns:
    - GAME_ID
  dimensions:
  - name: DEVELOPER_NAME
    expr: DEVELOPER_NAME
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  - name: FRANCHISE_NAME
    expr: FRANCHISE_NAME
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  - name: GAME_ID
    expr: GAME_ID
    data_type: NUMBER(38,0)
    access_modifier: public_access
  - name: GAME_NAME
    expr: GAME_NAME
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  - name: POV
    expr: POV
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  - name: PUBLISHER_NAME
    expr: PUBLISHER_NAME
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  - name: RELEASE_DATE
    expr: RELEASE_DATE
    data_type: DATE
    access_modifier: public_access
  - name: STATUS
    expr: STATUS
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  metrics:
  - name: GAME_COUNT
    expr: COUNT(games.GAME_ID)
    access_modifier: public_access
- name: GAME_FRANCHISES
  base_table:
    database: ONTOLOGY_DEMO
    schema: GAME_CATALOG
    table: GAME_FRANCHISES
  primary_key:
    columns:
    - GAME_ID
  dimensions:
  - name: RELATED_GAME_ID
    expr: RELATED_GAME_ID
    data_type: NUMBER(38,0)
    access_modifier: public_access
  - name: RELATIONSHIP_TYPE
    expr: RELATIONSHIP_TYPE
    data_type: VARCHAR(16777216)
    access_modifier: public_access
relationships:
- name: FRANCHISE_GAME
  left_table: GAME_FRANCHISES
  right_table: GAMES
  relationship_columns:
  - left_column: GAME_ID
    right_column: GAME_ID
