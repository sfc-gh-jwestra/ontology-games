name: SV_GAMING_CROSS_DOMAIN_RESOLVED
description: 'Composed view: imports the three domain views and resolves every Sales title to a Catalog game through TITLE_GAME_MAP (Game Identity Match Rule: strong key, title-code crosswalk, then name
  + release year).'
imports:
- database_name: ONTOLOGY_DEMO
  schema_name: CROSS_DOMAIN
  name: SV_GAME_CATALOG
- database_name: ONTOLOGY_DEMO
  schema_name: CROSS_DOMAIN
  name: SV_GENRE_TAXONOMY
- database_name: ONTOLOGY_DEMO
  schema_name: CROSS_DOMAIN
  name: SV_GAME_COMMERCE
tables:
- name: TITLE_GAME_MAP
  description: One row per Sales title with its resolved Catalog game and the match route used.
  base_table:
    database: ONTOLOGY_DEMO
    schema: CROSS_DOMAIN
    table: VW_TITLE_GAME_MAP
  primary_key:
    columns:
    - TITLE_ID
  dimensions:
  - name: MAP_TITLE_ID
    expr: TITLE_ID
    data_type: NUMBER(38,0)
    access_modifier: public_access
  - name: MAP_GAME_ID
    expr: GAME_ID
    data_type: NUMBER(38,0)
    access_modifier: public_access
  - name: MATCH_ROUTE
    expr: MATCH_ROUTE
    data_type: VARCHAR(16777216)
    description: STRONG = TITLES.CATALOG_GAME_ID, MEDIUM = TITLE_CODE_XREF, WEAK = name + release year.
    access_modifier: public_access
  metrics:
  - name: MAPPED_TITLE_COUNT
    expr: COUNT(title_game_map.TITLE_ID)
    access_modifier: public_access
relationships:
- name: TITLE_TO_MAP
  left_table: TITLES
  right_table: TITLE_GAME_MAP
  relationship_columns:
  - left_column: TITLE_ID
    right_column: TITLE_ID
- name: MAP_TO_GAME
  left_table: TITLE_GAME_MAP
  right_table: GAMES
  relationship_columns:
  - left_column: GAME_ID
    right_column: GAME_ID
