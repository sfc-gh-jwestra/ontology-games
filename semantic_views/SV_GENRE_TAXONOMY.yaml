  - name: GAME_A_NAME
    expr: GAME_A_NAME
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  - name: GAME_B_ID
    expr: GAME_B_ID
    data_type: NUMBER(38,0)
    access_modifier: public_access
  - name: GAME_B_NAME
    expr: GAME_B_NAME
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  facts:
  - name: OVM_GENRE_OVERLAP
    expr: GENRE_OVERLAP
