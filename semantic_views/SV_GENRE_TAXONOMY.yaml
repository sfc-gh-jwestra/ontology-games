    access_modifier: public_access
  - name: OVM_POV_MATCH
    expr: POV_MATCH
    data_type: NUMBER(1,0)
    access_modifier: public_access
  - name: OVM_NARRATIVE_MATCH
    expr: NARRATIVE_MATCH
    data_type: NUMBER(1,0)
    access_modifier: public_access
- name: CANNIBALIZATION_CANDIDATES
  description: Same-publisher game pairs similar enough to compete for the same players.
  base_table:
