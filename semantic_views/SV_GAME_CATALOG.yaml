# Semantic view ONTOLOGY_DEMO.GAME_CATALOG.SV_GAME_CATALOG
name: SV_GAME_CATALOG
description: 'Business Ontology domain: Game Catalog. Catalog games, franchises, ratings, engines, modes, platforms, monetization, awards, accessibility and input devices (GAME_CATALOG).'
tables:
