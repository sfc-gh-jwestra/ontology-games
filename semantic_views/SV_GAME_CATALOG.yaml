    schema: GAME_CATALOG
    table: GAMES
  primary_key:
    columns:
    - GAME_ID
  dimensions:
  - name: DEVELOPER_NAME
    expr: DEVELOPER_NAME
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  - name: FRANCHISE_NAME
    expr: FRANCHISE_NAME
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  - name: GAME_ID
    expr: GAME_ID
    data_type: NUMBER(38,0)
    access_modifier: public_access
