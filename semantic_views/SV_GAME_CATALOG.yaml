    expr: RELEASE_DATE
    data_type: DATE
    access_modifier: public_access
  - name: STATUS
    expr: STATUS
    data_type: VARCHAR(16777216)
    access_modifier: public_access
  metrics:
  - name: GAME_COUNT
    expr: COUNT(games.GAME_ID)
    access_modifier: public_access
